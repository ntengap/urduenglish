<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8372D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1514" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#F1F4F3}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>انگلش روزانہ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
/* Layout: one thing per screen. Home = today card + a climbing staircase of 6 days. Each day runs Learn > Trace > Quiz, big type, one button at the bottom. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#15201E; --muted:#5C6A67; --line:#D8DFDD;
  --seal:#C8372D; --seal-ink:#FFFFFF; --jade:#1D7767; --good:#DCF1E9; --bad:#FBE0DC; --grid:#E3B7B2;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --han:'Noto Serif SC','Songti SC','SimSun',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1514; --surface:#172120; --ink:#EAF0EE; --muted:#9AA9A5; --line:#2A3835;
  --seal:#E65C4F; --seal-ink:#1A0907; --jade:#4DBBA5; --good:#16372F; --bad:#3E1E1B; --grid:#5A3834; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#172120; --ink:#EAF0EE; --muted:#9AA9A5; --line:#2A3835;
  --seal:#E65C4F; --seal-ink:#1A0907; --jade:#4DBBA5; --good:#16372F; --bad:#3E1E1B; --grid:#5A3834; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
svg{display:block}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:14px 16px;gap:16px}
.han{font-family:var(--han)}

/* top bars */
.bar{display:flex;align-items:center;gap:12px}
.logo{font-family:var(--han);font-weight:900;font-size:22px;flex:1}
.logo b{color:var(--seal)}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800;display:flex;gap:6px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon-btn:active{transform:scale(.94)}
.track{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;background:var(--jade);border-radius:9px;transition:width .3s}
.step-label{font-weight:800;font-size:14px;color:var(--muted);min-width:64px;text-align:right}

/* home hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero-top{display:flex;align-items:baseline;justify-content:space-between}
.day-n{font-family:var(--han);font-weight:900;font-size:44px;line-height:1}
.day-t{color:var(--muted);font-weight:700}
.hanzi-row{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--han);font-weight:700;font-size:40px;line-height:1.1}
.steps{display:flex;gap:8px}
.step{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--muted)}
.step i{width:100%;height:8px;border-radius:9px;background:var(--line)}
.step.on{color:var(--ink)} .step.on i{background:var(--jade)}
.btn{background:var(--seal);color:var(--seal-ink);font-weight:800;font-size:20px;height:60px;border-radius:20px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

/* staircase */
.stairs{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.stair{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left}
.stair.sel{border:2px solid var(--seal)}
.stair.lock{opacity:.5}
.stair .n{font-weight:800;width:22px;color:var(--muted)}
.stair .h{font-family:var(--han);font-weight:700;font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:flex;gap:2px}

/* learn */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
.stage.top{justify-content:flex-start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.big{font-family:var(--han);font-weight:900;font-size:clamp(84px,30vw,128px);line-height:1.05;word-break:keep-all}
.py{font-weight:800;font-size:30px;color:var(--seal)}
.en{font-size:20px;color:var(--muted);font-weight:700}
.say{display:flex;gap:10px;margin-top:10px}
.chip-btn{height:52px;padding:0 20px;border-radius:99px;background:var(--jade);color:var(--seal-ink);font-weight:800;display:flex;align-items:center;gap:8px}
.chip-btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.parts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.part{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:8px;align-items:baseline}
.part b{font-family:var(--han);font-size:22px}
.part span{font-size:14px;color:var(--muted);font-weight:700}
.foot{display:flex;gap:10px}
.foot .icon-btn{width:60px;height:60px;border-radius:20px}

/* trace */
.tbox{width:max(220px,min(100%,420px,calc(100svh - 380px)));aspect-ratio:1;margin:0 auto;position:relative;background:var(--surface);
  border:3px solid var(--seal);border-radius:20px;overflow:hidden;container-type:inline-size;max-width:100%}
.tbox svg{position:absolute;inset:0;width:100%;height:100%}
.tghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--han);font-weight:500;font-size:min(60vw,260px);font-size:78cqw;line-height:1;color:var(--seal);opacity:.2;pointer-events:none}
.praise{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--jade);color:var(--seal-ink);font-weight:800;font-size:20px;padding:6px 16px;border-radius:99px;animation:rise 1.1s ease-out both;pointer-events:none;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
.tghost.ok{color:var(--jade);opacity:.5;transition:opacity .3s}
.fb-btn{display:flex;align-items:center;gap:12px;padding:6px 16px;border-radius:99px}
.fb-btn:active{background:var(--line)}
.revrow{display:flex;gap:10px}
.revrow .rev{flex:1;min-width:0;width:auto}
.revcol{display:flex;flex-direction:column;gap:10px}
.act-zh{font-weight:900;font-size:clamp(44px,15vw,64px);line-height:1.15}
.act-pic{font-size:84px;line-height:1.1;margin-top:6px}
.okpill{display:flex;align-items:center;gap:8px;background:var(--jade);color:var(--seal-ink);font-weight:800;font-size:20px;border-radius:99px;padding:6px 18px}
.rev.tone{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:0 16px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.tcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:22px;background:var(--surface);border:2px solid var(--line)}
.tcard svg,.topt svg{width:64px;height:64px;stroke:var(--ink);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tcard b{font-size:30px;font-weight:800}
.tcard span{font-family:var(--han);font-size:22px;color:var(--muted)}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.topt{height:112px;border-radius:22px;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.topt svg{width:72px;height:72px}
.topt.good{background:var(--good);border-color:var(--jade)}
.topt.bad{background:var(--bad);border-color:var(--seal);animation:shake .3s}
.topt[disabled]{cursor:default}
.bk{display:flex;flex-direction:column;gap:12px;width:100%}.bk .btn{width:100%}.bk-msg{min-height:24px;text-align:center;font-weight:700;color:var(--muted)}.bk-link{align-self:center;margin:6px 0 18px;padding:10px 16px;color:var(--muted);font-weight:700;text-decoration:underline}
.inst{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px 10px 10px 16px}
.inst-t{flex:1;font-weight:800;min-width:120px}
.inst .btn{width:auto;height:44px;padding:0 20px}
.inst-h{flex-basis:100%;color:var(--muted);font-weight:600;font-size:15px;padding:2px 6px 4px 0}
.rt{display:flex;align-items:center;gap:8px}
.tmr{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:99px;color:var(--muted);font-weight:700;font-size:13px;background:transparent;border:1px solid var(--line)}
.tmr svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.rev.full{height:60px;flex-direction:row;align-items:center;justify-content:space-between;padding:0 18px}
.streak{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px}
.sdots{display:flex;gap:6px}
.sd{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.sd.on{background:var(--jade);border-color:var(--jade);color:#fff}
.sd.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line)}
.sn{display:flex;align-items:center;gap:5px;font-weight:800;color:var(--ink)}
.sn svg{width:18px;height:18px;fill:var(--seal)}
.bk-row{display:flex;justify-content:center;gap:8px}.bk-row .bk-link{margin:6px 0 18px}
.bk .btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pgrid a{height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);text-decoration:none}
.stage>.speaker{margin:0 auto 8px}
.mv-word{font-family:var(--han);font-weight:900;font-size:72px;line-height:1.1;text-align:center}
.mv-sub{text-align:center;color:var(--muted);font-weight:600;margin:6px 0 14px}
.mv-sub b{color:var(--ink);font-family:var(--han)}
.mv-en{font-size:14px;opacity:.85}
.mv-arrow{font-size:96px;line-height:1;text-align:center}
.mv-help{text-align:center;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin:6px 0 12px}
.docue{margin-top:10px;background:var(--good);border:2px solid var(--jade);border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;text-align:center;font-weight:700}
.docue b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade)}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0 10px}.dots i{width:22px;height:22px;border-radius:50%;background:var(--ink)}
.topt{flex-direction:column;gap:2px}.topt small{font-size:12px;font-weight:700;color:var(--muted)}
.tcard em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.tip{text-align:center;font-weight:600;color:var(--muted);min-height:20px;padding:0 6px}
.mis-s{flex:1;color:var(--muted);font-weight:700;font-size:14px}
.rev.test{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:0 16px}
.rev-last{font-weight:800;font-size:15px;color:var(--jade)}
.trow{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.trow .tt{width:70px;text-align:left;color:var(--muted)}
.trow .bar2{flex:1;height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.trow .bar2 i{display:block;height:100%;background:var(--jade);border-radius:9px}
.trow .n{width:44px;text-align:right}
.miss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.miss button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px;display:flex;flex-direction:column;align-items:center}
.miss b{font-family:var(--han);font-size:24px;line-height:1.1}
.miss span{font-size:12px;font-weight:700;color:var(--seal)}
.rev{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0 8px 0 18px;height:68px;text-align:left;width:100%}
.rev:active{transform:scale(.99)}
.rev-t{font-weight:800;font-size:18px}
.rev-h{flex:1;min-width:0;display:flex;gap:12px;font-family:var(--han);font-weight:700;font-size:26px;overflow:hidden;white-space:nowrap}
.rev-go{width:52px;height:52px;border-radius:50%;background:var(--jade);color:var(--seal-ink);display:grid;place-items:center;flex:none}
.btn.recording{background:var(--bad);border:2px solid var(--seal);color:var(--ink)}
.btn.recording svg{color:var(--seal);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.recrow{display:flex;gap:10px}
.recrow .btn{font-size:18px}
.gtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.gtab{flex:1 0 auto;padding:0 14px;height:44px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.gtab.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chosen{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px}
.cpill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 16px;font-family:var(--han);font-weight:700;font-size:22px}
.qtitle{font-size:36px;font-weight:800;text-align:center}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks.one{grid-template-columns:1fr}
.pick{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:92px;min-width:0}
.pick:active{transform:scale(.98)}
.pick.sel{border-color:var(--jade);background:var(--good)}
.pick .h{font-family:var(--han);font-weight:700;font-size:34px;line-height:1.1}
.pick .p{font-weight:800;color:var(--seal);font-size:14px}
.pick .e{font-size:13px;color:var(--muted)}
.sent{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px}
.tok{display:flex;flex-direction:column;align-items:center}
.tok .h{font-family:var(--han);font-weight:900;font-size:clamp(34px,11vw,48px);line-height:1.1}
.tok .p{font-size:13px;font-weight:700;color:var(--seal)}
.sub{color:var(--muted);font-size:15px;text-align:center;text-wrap:balance}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,12,10,.55);display:flex;align-items:flex-end;justify-content:center;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.ov[hidden]{display:none!important}
.sheet{width:100%;max-width:480px;max-height:94%;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.chat{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0;min-height:0}
.who{display:flex;align-items:center;gap:10px;font-weight:800}
.ava{width:40px;height:40px;border-radius:50%;background:var(--jade);color:var(--seal-ink);display:grid;place-items:center;font-family:var(--han);font-weight:900;font-size:20px}
.bub{max-width:88%;text-align:left;border-radius:20px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;display:flex;flex-direction:column;gap:1px}
.bub.me{align-self:flex-end;background:var(--good);border-color:var(--jade)}
.bub .zh{font-family:var(--han);font-weight:700;font-size:22px;line-height:1.25}
.bub .pyl{font-size:13px;font-weight:700;color:var(--muted)}
.bub .enl{font-size:13px;color:var(--muted);opacity:.85}
.bub.now{outline:3px solid var(--seal);outline-offset:1px}
.cheer{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
.demo{position:absolute;inset:0;pointer-events:none}
.demo svg{position:absolute;inset:0;width:100%;height:100%}
.tbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.thead{display:flex;flex-direction:column;align-items:center;gap:2px}
.thead .py{font-size:28px}
.tctl{display:flex;gap:10px;justify-content:center}

/* quiz */
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0}
.prompt .q{font-size:30px;font-weight:800;line-height:1.15;text-wrap:balance}
.prompt .hint{color:var(--muted);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.speaker{width:104px;height:104px;border-radius:50%;background:var(--jade);color:var(--seal-ink);display:grid;place-items:center}
.speaker:active{transform:scale(.95)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{height:76px;border-radius:20px;background:var(--surface);border:2px solid var(--line);font-family:var(--han);font-weight:700;font-size:38px}
.opt:active{transform:scale(.98)}
.opt.good{background:var(--good);border-color:var(--jade)}
.opt.bad{background:var(--bad);border-color:var(--seal);animation:shake .3s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;min-height:34px}
.fb .py{font-size:22px}
.fb .en{font-size:18px}

/* done */
.big-stars{display:flex;gap:8px;justify-content:center}
.score{font-weight:900;font-size:56px;font-family:var(--han);line-height:1}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.pop:nth-child(2){animation-delay:.12s}.pop:nth-child(3){animation-delay:.24s}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>
@font-face{font-family:'Noto Naskh Arabic';src:url(NaskhArabic-400.woff2) format('woff2');font-weight:400 500;font-display:swap}
@font-face{font-family:'Noto Naskh Arabic';src:url(NaskhArabic-700.woff2) format('woff2');font-weight:600 900;font-display:swap}
:root{--han:'Fraunces','Georgia','Noto Naskh Arabic',serif;--ui:'Figtree','Noto Naskh Arabic',system-ui,sans-serif}
body,button{font-family:'Figtree','Noto Naskh Arabic',system-ui,sans-serif}
.e,.p,.py,.sub,.en,.enl,.pyl,.hint,.mv-sub,.mv-en,.docue,.tip,.qtitle,.tcard em,.tcard small,.thead .py,.fb .py,.fb .en,.rev-t,.mis-s,.inst-t,.tt{unicode-bidi:plaintext}
.logo,.day-n,.big,.mv-word,.act-zh,.tok .h,.pick .h,.cpill,.bub .zh{font-variation-settings:'opsz' 72}
.big{font-size:clamp(54px,19vw,84px);word-break:normal;overflow-wrap:anywhere;text-align:center;font-weight:800;letter-spacing:-.01em;line-height:1.15}

<script>/* speech hardening: unlock on first tap, explicit voice, safe cancel */
(function(){try{var ss=window.speechSynthesis;if(!ss||!window.SpeechSynthesisUtterance)return;
var os=ss.speak.bind(ss),oc=ss.cancel.bind(ss),lastC=0,unlocked=false;
function pick(l){var vs=ss.getVoices();if(!vs.length)return null;l=String(l).toLowerCase().replace('_','-');var p=l.slice(0,2);
 return vs.filter(function(v){return v.lang.toLowerCase().replace('_','-')===l})[0]||vs.filter(function(v){return v.lang.toLowerCase().slice(0,2)===p})[0]||null}
ss.cancel=function(){if(ss.speaking||ss.pending){lastC=Date.now();oc()}};
ss.speak=function(u){try{if(u&&u.lang&&!u.voice){var v=pick(u.lang);if(v)u.voice=v}if(ss.paused)ss.resume()}catch(e){}
 var d=Date.now()-lastC<80?80:0;if(d)setTimeout(function(){os(u)},d);else os(u)};
function unlock(){if(unlocked)return;unlocked=true;try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;os(u)}catch(e){}}
['touchend','pointerup','click'].forEach(function(ev){addEventListener(ev,unlock,{capture:true,passive:true})});
}catch(e){}})();</script>

  const pt=e=>{const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}};
  cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}drawing=true;last=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.01,last.y);ctx.stroke()};
  cv.onpointermove=e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};
  const end=()=>{if(!drawing)return;drawing=false;strokeEnd()};
  cv.onpointerup=end;cv.onpointercancel=end;
}

function buildQuiz(d){
  const q=[];
  d.w.forEach(w=>['m','a'].forEach(t=>{
    const pool=d.w.filter(o=>o!==w&&(t==='m'||o[1]!==w[1]));
    q.push({t,w,opts:shuffle(shuffle(pool).slice(0,2).concat([w]))});
  }));
  return shuffle(q);
}
/* ---------- daily review ---------- */
const knownWords=()=>DAYS.filter(d=>{const p=S.done[d.n];return p&&(p.learn||p.quiz!=null)}).flatMap(d=>d.w);
const weakWords=()=>{const all=knownWords();return all.filter(w=>(S.w[w[0]]||0)>0).sort((a,b)=>(S.w[b[0]]||0)-(S.w[a[0]]||0))};
function mkQ(w,all,t,g){
  let pool=all.filter(o=>o!==w&&o[0]!==w[0]&&(t==='m'||o[1]!==w[1]));
  if(pool.length<2)pool=DAYS.flatMap(d=>d.w).filter(o=>o[0]!==w[0]&&(t==='m'||o[1]!==w[1]));
  return {t,w,g,opts:shuffle(shuffle(pool).slice(0,2).concat([w]))};
}
function buildTest(full){
  const all=knownWords(),by={};
  DAYS.forEach(d=>{const p=S.done[d.n];if(p&&(p.learn||p.quiz!=null)){const g=Math.ceil(d.n/6);(by[g]=by[g]||[]).push(...d.w.map(w=>({w,g})))}});
  const lists=Object.values(by).map(shuffle),out=[],used=new Set();
  const N=full?Math.min(all.length,Math.min(30,Object.keys(by).length*4)):Math.min(10,all.length);let guard=0;
  while(out.length<N&&guard++<400){for(const l of lists){const x=l.pop();if(x&&!used.has(x.w[0])){used.add(x.w[0]);out.push(x);if(out.length>=N)break}}}
  return shuffle(out).map(x=>mkQ(x.w,all,Math.random()<.5?'m':'a',x.g));
}
function buildReview(){
  const all=knownWords(),weak=weakWords().slice(0,5);
  const rest=shuffle(all.filter(w=>!weak.includes(w)));
  const pick=shuffle(weak.concat(rest.slice(0,Math.max(0,8-weak.length)))).slice(0,8);
  return pick.map(w=>{
    const t=Math.random()<.5?'m':'a';
    let pool=all.filter(o=>o!==w&&o[0]!==w[0]&&(t==='m'||o[1]!==w[1]));
    if(pool.length<2)pool=DAYS.flatMap(d=>d.w).filter(o=>o[0]!==w[0]&&(t==='m'||o[1]!==w[1]));
    return {t,w,opts:shuffle(shuffle(pool).slice(0,2).concat([w]))};
  });
}

const TTIP={1:'High and flat, like one steady note.',2:'Rising, like asking “What?”',3:'Dips down then up, like a puzzled “Hmm?”',4:'Falling fast, like a firm “No!”'},TCAP={1:'flat',2:'rising',3:'dip',4:'falling'};
const TBASE=[['妈','mā'],['书','shū'],['麻','má'],['来','lái'],['马','mǎ'],['好','hǎo'],['骂','mà'],['大','dà']];
const TMARK={ā:1,á:2,ǎ:3,à:4,ē:1,é:2,ě:3,è:4,ī:1,í:2,ǐ:3,ì:4,ō:1,ó:2,ǒ:3,ò:4,ū:1,ú:2,ǔ:3,ù:4,ǖ:1,ǘ:2,ǚ:3,ǜ:4};
const toneOf=p=>{for(const c of p)if(TMARK[c])return TMARK[c];return 0};
function tonePool(){
  const m={};
  DAYS.forEach(d=>d.w.forEach(w=>(w[3]||[]).forEach(b=>{if(b[0].length===1&&!/\s/.test(b[1])){const t=toneOf(b[1]);if(t&&!m[b[0]])m[b[0]]=[b[0],b[1],t]}})));
  TBASE.forEach(b=>{if(!m[b[0]])m[b[0]]=[b[0],b[1],toneOf(b[1])]});
  return Object.values(m);
}
function buildTones(){
  const pool=tonePool(),q=[];
  [1,2,3,4].forEach(t=>shuffle(pool.filter(x=>x[2]===t)).slice(0,2).forEach(x=>q.push(x)));

}

const MSTEPS=['trace','quiz','move'];
function missionStart(){V.mission={k:-1};V.review=false;V.test=false;missionNext()}
function missionNext(){
  const m=V.mission;if(!m)return;m.k++;
  const d=D();
  if(m.k===0){V.items=shuffle(traceItems(d)).slice(0,2);go('trace')}
  else if(m.k===1){
    let q=buildQuiz(d).slice(0,3);
    try{if(knownWords().length>=4)q=q.concat(buildReview().slice(0,2))}catch(e){}
    V.review=true;V.test=false;V.q=shuffle(q);V.score=0;go('quiz')}
  else if(m.k===2){V.review=false;V.mv={q:mvBuild().slice(0,5),i:0,st:0,sel:null};go('move')}
  else{V.mission=null;V.review=false;S.mission=dkey();S.missions=(S.missions||0)+1;S.moves=(S.moves||0)+1;save();V.view='mission';render();chime()}
}

const stripE=z=>z.replace(/[！？]$/,'');
const lowerFirst=t=>t[0].toLowerCase()+t.slice(1);
function mkPair(a,b){
  return {zh:stripE(a.zh)+'，然后'+stripE(b.zh)+'！',py:a.py+', ránhòu '+b.py,en:a.en+', then '+lowerFirst(b.en),pic:a.pic+' '+b.pic,cue:'Two steps, in order'};
}
function pairsFrom(list,n,anchor){
  const out=[],used=new Set();let g=0;
  while(out.length<n&&g++<60){
    const a=anchor||list[Math.floor(Math.random()*list.length)],b=list[Math.floor(Math.random()*list.length)];
    if(!a||!b||a===b||a.zh===b.zh)continue;
    const k=a.zh+'|'+b.zh;if(used.has(k))continue;used.add(k);out.push(mkPair(a,b));
  }
  return out;
}

function mkTriple(a,b,c){
  return {zh:'先'+stripE(a.zh)+'，然后'+stripE(b.zh)+'，最后'+stripE(c.zh)+'！',py:'xiān '+a.py+', ránhòu '+b.py+', zuìhòu '+c.py,en:'First '+lowerFirst(a.en)+', then '+lowerFirst(b.en)+', finally '+lowerFirst(c.en),pic:a.pic+' '+b.pic+' '+c.pic,cue:'Three steps, in order'};
}
function triplesFrom(list,n){
  const out=[];let g=0;
  while(out.length<n&&g++<60){
    const t=shuffle(list).slice(0,3);if(t.length<3)break;
    if(new Set(t.map(x=>x.zh)).size<3)continue;
    out.push(mkTriple(t[0],t[1],t[2]));
  }
  return out;
}
const actPool=()=>{const L=learnedDays();return ACTS.filter(a=>L.has(a.d))};

const VPIC={go:'🚶',eat:'🍚',work:'💻',sleep:'😴',study:'📖',drink:'🥤',buy:'🛒',getup:'🛏️',shower:'🚿',brush:'🦷',see:'👀',breakfast:'🥣',lunch:'🥪',dinner:'🍽️'};
function performCard(){
  const s=sel(),k=pat().k;let pic='🎭',cue='اداکاری کرو';
  if(k==='do'||k==='want')pic=VPIC[s.what.k]||pic;
  else if(k==='weather')pic=s.wth.k==='hot'?'🥵':s.wth.k==='cold'?'🥶':'🌧️';
  else if(k==='feel')pic={happy:'😄',tired:'🥱',hungry:'😋',thirsty:'🥤'}[s.feel.en]||pic;
  else if(k==='travel')pic={'by car':'🚗','by subway':'🚇','by plane':'✈️','on foot':'🚶'}[s.mode.en]||pic;
  else if(k==='this'||k==='colour'){pic='👉';cue='اس کی طرف یا اس جیسی چیز کی طرف اشارہ کرو'}
  else if(k==='date'){pic='🎂';cue='کہو، پھر دوست کو اپنی سالگرہ بتاؤ'}
  else if(k==='job'){pic='💼';cue='پیشے کی اداکاری کرو'}
  else if(k==='clock'){pic=VPIC[s.clk.k]||'🕐';cue='کلائی تھپتھپاؤ، پھر اداکاری کرو'}
  else if(k==='have'){pic=s.num.n<=9?s.num.n+'️⃣':s.num.n===10?'🔟':'🔢';cue='انگلیوں سے دکھاؤ'}
  else if(k==='where'){pic='📍';cue='اشارہ کرو کہ یہ کہاں ہے'}
  else if(k==='price'){pic=s.adj.en==='cheap'?'🏷️':s.adj.en==='expensive'?'💰':'😋';cue='چہرے سے دکھاؤ'}
  else if(k==='order'){pic='🙏';cue='ہاتھ بڑھاؤ اور مانگو'}
  else if(k==='sorry'){pic='🙇';cue='کہتے ہوئے تھوڑا جھکو'}
  else if(k==='health'){pic='🤕';cue='چہرے اور ہاتھوں سے دکھاؤ'}
  else if(k==='direction'){pic={'on the left':'⬅️','on the right':'➡️','in front':'⬆️',behind:'⬇️'}[s.dir.en]||'📍';cue='اس طرف اشارہ کرو'}
  return {zh:crZh(),py:zhTokens().map(t=>t.py).join(' '),en:enSent(),pic,cue};
}
function act(){
  const a=V.a,n=a.q.length;
  if(a.i>=n){
    $('#app').innerHTML=`${topbar('اداکاری',1)}
  <div class="stage top" style="align-items:center;text-align:center">
    <div class="big-stars" style="margin-top:8px">${[1,2,3].map(()=>`<div class="pop">${star(true,64)}</div>`).join('')}</div>
    <div class="score">${n}/${n}</div>
    <div class="miss">${a.q.map(c=>`<button data-a="say" data-t="${c.zh.replace(/[！]/g,'')}" data-r=".6"><b style="font-size:20px">${c.zh.replace('！','')}</b><span>${c.pic}</span></button>`).join('')}</div>
  </div>
  <div class="foot" style="flex-direction:column"><button class="btn" data-a="start" data-s="${a.day?'actday':'act'}">پھر سے</button><button class="btn ghost" data-a="home">ہوم</button></div>`;
    return;
  }
  const c=a.q[a.i],reveal=a.shown||a.done,last=a.i===n-1;
  $('#app').innerHTML=`${topbar(`اداکاری ${a.i+1}/${n}`,a.i/n)}
  <div class="stage"><div class="card">
    ${c.cue?`<div class="hint" style="color:var(--muted);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.08em;text-align:center">${c.cue}</div>`:''}
    <div class="act-zh han" ${c.zh.length>8?'style="font-size:clamp(26px,8vw,36px)"':''}>${c.zh}</div>
    <div class="py">${c.py}</div>
    <div class="act-pic" ${reveal?'':'style="opacity:.12"'}>${reveal?c.pic:'?'}</div>
    <div class="sub" style="min-height:44px">${reveal?c.en:''}</div>
    ${a.done?`<div class="okpill pop">${ICON.check}شاباش!</div>`:''}
    <div class="say"><button class="chip-btn" data-a="ahear">${ICON.spk}پھر سے</button>${reveal?'':`<button class="chip-btn alt" data-a="ashow">دکھاؤ</button>`}</div>
  </div></div>
  <div class="foot"><button class="btn" data-a="${a.done?'anext':'adone'}">${a.done?(last?'ختم':'اگلا'):'میں نے کر لیا'}</button></div>`;
}

function recReset(){
  try{if(REC.mr&&REC.mr.state==='recording')REC.mr.stop()}catch(e){}
  if(REC.url){try{URL.revokeObjectURL(REC.url)}catch(e){}}
  if(REC.audio){try{REC.audio.pause()}catch(e){}}
  REC={state:'idle',url:null,mr:null,chunks:[],audio:null};
}
async function recToggle(){
  if(REC.state==='rec'){try{REC.mr.stop()}catch(e){}return}
  try{speechSynthesis.cancel()}catch(e){}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(stream),chunks=[];
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());clearTimeout(REC.tm);
      if(!V.d)return;
      if(REC.url){try{URL.revokeObjectURL(REC.url)}catch(e){}}
      REC.url=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/mp4'}));
      REC.state='ready';if(V.d&&!V.d.stage)dlgRender();
    };
    REC.mr=mr;REC.state='rec';mr.start();REC.tm=setTimeout(()=>{try{mr.stop()}catch(e){}},10000);
    dlgRender();
  }catch(e){REC.state='err';dlgRender()}
}
function recPlay(){
  if(!REC.url)return;try{speechSynthesis.cancel()}catch(e){}
  try{if(REC.audio)REC.audio.pause();REC.audio=new Audio(REC.url);REC.audio.play().catch(()=>{})}catch(e){}
}

function startStep(s){
  if(s==='mission'){missionStart();return}
  V.mission=null;
  if(s!=='review'&&s!=='quiz')V.review=false;
  if(s!=='test'&&s!=='fulltest')V.test=false;
  if(s!=='fulltest')V.full=false;
  if(s==='actday'){V.review=false;const own=shuffle(ACTS.filter(a=>a.d===V.day)),earlier=actPool().filter(a=>a.d<V.day);
    const prs=[];if(own.length>=2)prs.push(...pairsFrom(own,1));
    if(earlier.length)prs.push(...pairsFrom(earlier,1,own[0]));
    if((S.acts||0)>=8&&own.length>=3)prs.push(...triplesFrom(own,1));
    V.a={q:own.slice(0,4).concat(prs),i:0,shown:false,done:false,day:V.day};go('act');setTimeout(actSay,300);return}
  if(s==='act'){V.review=false;const pool=actPool();const adv=(S.acts||0)>=8&&pool.length>=4;
    const sg=shuffle(pool).slice(0,adv?3:(pool.length>=4?5:pool.length));
    V.a={q:sg.concat(pool.length>=2?pairsFrom(pool,3):[]).concat(adv?triplesFrom(pool,2):[]),i:0,shown:false,done:false};go('act');setTimeout(actSay,300);return}
  if(s==='move'){V.review=false;V.test=false;V.mv={q:mvBuild(),i:0,st:0,sel:null};go('move');return}
  if(s==='tones'){V.review=false;V.test=false;V.t={i:-1,q:buildTones(),score:0,answered:null};go('tones');return}
  if(s==='trace'){V.items=traceItems(D());go('trace')}
  else if(s==='quiz'){V.review=false;V.test=false;V.q=buildQuiz(D());V.score=0;go('quiz')}
  else if(s==='fulltest'){V.review=false;V.test=true;V.full=true;V.res=[];V.q=buildTest(true);V.score=0;go('quiz')}
  else if(s==='test'){V.review=false;V.test=true;V.full=false;V.res=[];V.q=buildTest();V.score=0;go('quiz')}
  else if(s==='review'){V.test=false;V.review=true;V.q=buildReview();V.score=0;go('quiz')}
  else if(s==='create'){crReset();go('create')}
  else go('learn');
}

function esRespellSyl(w){
  const k=w.toLowerCase().replace(/’/g,"'");
  if(ENR[k])return ENR[k].split('-');
  if(k.includes('-')&&!/^-|-$/.test(k))return k.split('-').flatMap(esRespellSyl);
  return [k];
}
function esRespellWord(w){
  const k=w.toLowerCase().replace(/’/g,"'");
  if(ENR[k])return ENR[k].replace(/-/g,'');
  if(k.includes('-')&&!/^-|-$/.test(k))return k.split('-').map(esRespellWord).join(' ');
  return k;
}
function esWordSyl(w){
  const k=w.toLowerCase();const c=ENCH[k];

  if(k.includes('-')&&!/^-|-$/.test(k)){return w.split('-').flatMap((p,i,a)=>{const x=esWordSyl(p);if(i<a.length-1)x[x.length-1]+='-';return x})}
  return [w];
}

function enSent(){
  const s=sel(),k=pat().k,S=sub();

    const W=s.when||{t:'pres',en:''},Vb=s.what,v=VERB[Vb.k];
    const vp=k==='want'?(S.s3?'wants to ':'want to ')+(Vb.k==='see'?'see':v[1]):{past:v[0],pres:S.s3?v[2]:v[1],fut:'will '+v[1],prog:S.be+' '+v[3]}[W.t];
    let tail='';
    if(Vb.k==='go')tail=' '+s.where.go;
    else if(Vb.need==='none')tail=Vb.k==='brush'?' '+S.poss+' teeth':Vb.k==='medicine'?' medicine':'';
    else if(Vb.need==='objonly')tail=(k==='want'?' ':' to see ')+s.obj.en;
    else if(Vb.need==='obj2')tail=' the '+s.obj.en;
    else{if(Vb.need==='obj')tail=' '+s.obj.en;tail+=' '+s.where.at}
    return cap(S.en)+' '+vp+tail+(k==='want'?'':' '+W.en)+'.';
  }
  if(k==='weather'){
    const W=s.when,X=s.wth;
    if(X.k==='rain')return {past:'It rained yesterday.',pres:'It is raining today.',fut:'It will rain tomorrow.',prog:'It is raining now.'}[W.t];
    return `The weather ${{past:'was',pres:'is',fut:'will be',prog:'is'}[W.t]} ${X.en} ${W.en}.`;
  }
  if(k==='travel'){const W=s.when,P=s.where,v=VERB.go;const vp={past:v[0],pres:S.s3?v[2]:v[1],fut:'will '+v[1],prog:S.be+' '+v[3]}[W.t];return `${cap(S.en)} ${vp} ${P.go} ${s.mode.en} ${W.en}.`}
  if(k==='price')return `${s.dem.k==='this'?'This':'That'} ${s.obj.en} is ${s.adj.en}.`;
  if(k==='order')return `Please give me ${s.obj.en}.`;
  if(k==='direction')return `${s.where.k==='home'?'Home':'The '+s.where.en} is ${s.dir.en}.`;
  if(k==='date')return `${S.tok?cap(S.en)+"'s":cap(S.poss)} birthday is on ${s.month.en} ${s.dayn.ord}.`;
  if(k==='job')return `${cap(S.en)} ${S.be} ${S.be==='are'?s.job.pl:(/^[aeiou]/.test(s.job.en)?'an ':'a ')+s.job.en}.`;
  if(k==='clock'){const v=VERB[s.clk.k];return `${cap(S.en)} ${S.s3?v[2]:v[1]}${s.clk.k==='brush'?' '+S.poss+' teeth':''} at ${s.half.half?s.hour.n+':30':s.hour.n+" o'clock"}.`}
  if(k==='health')return `${cap(S.poss)} ${s.body.en} ${s.body.plural?'hurt':'hurts'}.`;
  if(k==='feel'){const W=s.when;return `${cap(S.en)} ${{past:S.be==='are'?'were':'was',pres:S.be,fut:'will be',prog:S.be}[W.t]} ${s.feel.en} ${W.en}.`}
  if(k==='sorry'){const W=s.when,P=s.where;return `Sorry, I ${W.t==='fut'?"won't go":"didn't go"} ${P.go} ${W.en}.`}
  if(k==='colour'){const pl=s.noun.plural,th=s.dem.k==='this';return `${pl?(th?'These are':'Those are'):(th?'This is':'That is')} ${pl?'':'a '}${s.col.en} ${s.noun.en}.`}
  if(k==='where')return `${cap(S.en)} ${S.be} ${s.where.at}.`;

  if(k==='health'){const a=S.ask;return {zh:`${a.h}怎么了？`,py:`${a.py} zěnme le?`,en:`What is wrong with ${({he:'him',she:'her',they:'them','you all':'you all'})[a.en]||a.en}?`}}
  if(k==='want'){const a=S.ask;return {zh:`${a.h}想做什么？`,py:`${a.py} xiǎng zuò shénme?`,en:`What ${a.t3?'does':'do'} ${a.en} want to do?`}}
  if(k==='order')return {zh:'你要什么？',py:'nǐ yào shénme?',en:'What would you like?'};

  if(a==='sptile'){
    if(sp.done)return;
    const k=+b.dataset.k,t=sp.tiles[k];if(t.used)return;
    const j=sp.slots.findIndex(s=>!s.gap&&!s.filled);
    if(t.ch===sp.slots[j].ch){
      t.used=true;sp.slots[j].filled=t.ch;sp.wrong=0;
      if(!sp.slots.some(s=>!s.gap&&!s.filled)){sp.done=true;trace();praise();chime();setTimeout(()=>speak(sp.word,.7),350);return}
      trace();
    }else{sp.wrong++;sp.err=k;trace()}
  }else if(a==='spundo'){
    if(sp.done)return;
    for(let j=sp.slots.length-1;j>=0;j--){const s=sp.slots[j];if(!s.gap&&!s.auto&&s.filled){const ch=s.filled;s.filled=false;for(let k=sp.tiles.length-1;k>=0;k--){if(sp.tiles[k].used&&sp.tiles[k].ch===ch){sp.tiles[k].used=false;break}}break}}
    trace();
  }else if(a==='spshow'){sp.show=!sp.show;trace()}
  else if(a==='sphear')speak(it.c,.7);
  else if(a==='spdone'){
    if(!sp.done)return;
    if(V.i<V.items.length-1)go('trace',V.i+1);
    else if(V.mission)missionNext();
    else{prog(D().n).trace=1;save();startStep('quiz')}
  }
});
/* sounds drill (replaces tones) */
const ES_PAIRS=[['ship','sheep','i'],['live','leave','i'],['sit','seat','i'],['bit','beat','i'],['thin','tin','th'],['think','sink','th'],['three','tree','th'],['hat','at','h'],['hair','air','h'],['heat','eat','h']];
function buildTones(){
  return shuffle(ES_PAIRS).slice(0,8).map(p=>{
    const i=Math.random()<.5?0:1,opts=Math.random()<.5?[p[0],p[1]]:[p[1],p[0]];
    return [p[i],esRespellWord(p[i]),opts.indexOf(p[i]),opts,p[2]];
  });
}
function tones(){
  const T=V.t;
  if(T.i<0){
    $('#app').innerHTML=`${topbar(LN.sounds,0)}
    <div class="stage"><div class="hint">${LN.sndIntro}</div>
    <div class="tgrid">${LN.snd.map(e=>`<button class="tcard" data-a="say" data-t="${e.w}" data-r=".6"><b>${esRespellWord(e.w)}</b><span>${e.w} <small class="ur">${e.m}</small></span><em>${e.t}</em></button>`).join('')}</div></div>
    <div class="foot"><button class="btn" data-a="tstart">${LN.practise}</button></div>`;
    return;
  }
  if(T.i>=T.q.length){

    S.tones=S.tones||[];S.tones.push({t:Date.now(),s:sc,n});if(S.tones.length>30)S.tones.shift();save();
    $('#app').innerHTML=`${topbar(LN.sounds,1)}
    <div class="stage top" style="align-items:stretch;text-align:center"><div class="big-stars" style="margin-top:8px">${[1,2,3].map(i=>`<div class="pop">${star(s>=i,64)}</div>`).join('')}</div><div class="score">${sc}/${n}</div></div>
    <div class="foot" style="flex-direction:column"><button class="btn" data-a="tnew">${LN.again}</button><button class="btn ghost" data-a="home">${LN.home}</button></div>`;
    chime();return;
  }
  const q=T.q[T.i],a=T.answered;
  $('#app').innerHTML=`${topbar(`${LN.sounds} ${T.i+1}/${T.q.length}`,T.i/T.q.length)}
  <div class="stage"><div class="prompt"><div class="hint">${LN.whichWord}</div><button class="speaker" data-a="say" data-t="${q[0]}" data-r=".6" aria-label="${LN.play}">${ICON.spkBig}</button></div>
  <div class="topts">${q[3].map((w,k)=>`<button class="topt ${a!=null?(k===q[2]?'good':k===a?'bad':''):''}" data-a="tans" data-k="${k}" ${a!=null?'disabled':''}><b style="font-size:30px">${w}</b>${a!=null?`<small>${LN.pm[w]}</small>`:''}</button>`).join('')}</div>
  <div class="fb">${a!=null?`<button class="fb-btn" data-a="say" data-t="${q[0]}" data-r=".6" aria-label="${LN.hearAgain}">${ICON.spk}<span class="py">${q[1]}</span><span class="en">${q[0]}</span></button>`:''}</div><div class="tip">${a!=null?LN.tip[q[4]]:LN.sndListen}</div></div>
  <div class="foot"><button class="btn" data-a="tnext" ${a==null?'disabled':''}>${T.i===T.q.length-1?LN.seeScore:LN.next}</button></div>`;
  if(a==null)setTimeout(()=>speak(q[0],.6),150);
}
/* move: hunts and body parts */
const esIDK=["I don't know",esRe("I don't know"),IDK[2]],esIDU=["I don't understand",esRe("I don't understand"),IDU[2]];
const esPickI=(n,tw,word)=>{
  const f=[];if(tw)for(let i=0;i<n;i++){const w=word(i);if(tw.some(t=>t===w||(t.length>3&&(t.includes(w)||w.includes(t)))))f.push(i)}
  return (f.length&&Math.random()<.7)?f[Math.floor(Math.random()*f.length)]:Math.floor(Math.random()*n);
};
const esR=(t,en)=>[t,esRe(t),en];

function mvHunt(tw){
  const col=Math.random()<.4;
  const i=col?esPickI(4,tw,j=>ES_COLS[j]):esPickI(ES_HUNT.length,tw,j=>ES_HUNT[j][0]);
  const zh=col?`Find something ${ES_COLS[i]}!`:`Find ${ES_HUNT[i][1]}!`;
  const what=LN.what(i,col);
  const bare=col?null:LN.bare(i);
  return {t:'talk',q:[zh,esRe(zh),LN.find(what)],o:[
    [...esR('I found it!',LN.found),...esR('Very good! Show me!',LN.show),LN.holdUp(what)],
    [...esR("I don't have one",LN.none),...esR("It's OK! Look for something else.",LN.elseR),LN.lookElse],
    [...esIDU,...esR(col?"It's OK! Look around you!":`It's OK! ${esCap(ES_HUNT[i][0])}!`,col?LN.lookAround:LN.itsOk(bare)),LN.lookFor(what)]]};
}
function mvBody(tw){
  const i=esPickI(ES_BODY.length,tw,j=>ES_BODY[j][0]),b=ES_BODY[i],pl=b[2],P=!!UR_BODY[i][3];
  const be=pl?'are':'is';
  return {t:'talk',q:[`Where ${be} ${b[1]}?`,esRe(`Where ${be} ${b[1]}`),LN.where(P,i)],o:[
    [...esR('Here!',LN.here),...esR(`Good! Touch ${b[1]}!`,LN.touchGood(i)),LN.touch(i)],
    [...esIDK,...esR(`Look! ${esCap(b[1])} ${be} here.`,LN.look(P,i)),LN.findTouch(i)],
    [...esIDU,...esR(`It's OK! ${esCap(b[0])}!`,LN.ok(i)),LN.pointTo(i)]]};
}
/* dialogue */
function dlgLines(){
  const R=(zh,en)=>{zh=frNb(zh);return {zh,py:esRe(zh),en}};
  const gr=V.day===5?['Good morning',DL.gm]:['Hello',DL.hello];
  const q=question();
  const L={q:R(`${gr[0]}! ${q.zh}`,`${gr[1]}! ${q.en}`),a:R(crZh(),enSent()),
    g:V.day>=5?R('Good! Thank you!',DL.goodThanks):R('Good!',DL.good),c:R('Awesome!',DL.awesome)};
  if(V.day>=5)L.r=R("You're welcome!",DL.welcome);
  if(pat().k==='sorry'){L.g=R('No problem!',DL.noprob);L.r=R('Thank you!',DL.thanks);L.r2=R("You're welcome!",DL.welcome)}
  if(pat().k==='health'){L.g=R('Go and see the doctor!',DL.doctor);L.r=R('Thank you!',DL.thanks);L.r2=R("You're welcome!",DL.welcome)}
  if(V.day>=6){L.b=R('Goodbye!',DL.bye);L.b2=R('Goodbye!',DL.bye)}
  return L;
}
function question(){const t=esQuestion();return {zh:t,py:esRe(t),en:urQuestion()}}
function crOpts(k){
  const o=crOptsBase(k);
  if(k==='half')o.forEach(x=>{x.eh=x.half?'half past':"o'clock";x.ep=esRe(x.eh);x.mu=x.half?'ساڑھے':'پورے'});

}

esApplyTables();
const _TI=UR_TITLES;
DAYS.forEach((d,i)=>{

ACTS.forEach((a,i)=>{a.zh=ES_ACTS[i];a.py=esRe(a.zh);a.en=UR_ACTINS[i]});
const _UD=['آگے','پیچھے','بائیں طرف','دائیں طرف'];

}
